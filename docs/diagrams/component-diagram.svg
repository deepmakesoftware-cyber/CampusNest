<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890">
  <title>CampusNest UML component diagram</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .h1 { font-size: 22px; font-weight: bold; }
    .h2 { font-size: 13px; fill: #555; }
    .st { font-size: 11px; fill: #555; }
    .nm { font-size: 14px; font-weight: bold; }
    .onm { font-size: 15px; font-weight: bold; }
    .sb { font-size: 11.5px; fill: #444; }
    .pv { font-size: 11.5px; fill: #1f3a5f; font-style: italic; }
    .lbl { font-size: 12px; }
    .sys { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.6; }
    .ui { fill: #eef3fb; stroke: #34495e; stroke-width: 1.3; }
    .svc { fill: #edf7f5; stroke: #34495e; stroke-width: 1.3; }
    .data { fill: #f3effa; stroke: #34495e; stroke-width: 1.3; }
    .api { fill: #fdf6e9; stroke: #34495e; stroke-width: 1.3; }
    .ext { fill: #fbfbfb; stroke: #555; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .sub { fill: #fbfcfd; stroke: #34495e; stroke-width: 1.3; }
    .dep { fill: none; stroke: #222; stroke-width: 1.3; stroke-dasharray: 6 4; marker-end: url(#open); }
    .note { fill: #fffef2; stroke: #888; stroke-width: 1; }
  </style>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
    <symbol id="ci" viewBox="0 0 20 22">
      <rect x="4" y="1" width="15" height="20" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <rect x="0.7" y="5" width="7.5" height="4" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <rect x="0.7" y="13" width="7.5" height="4" fill="#fff" stroke="#222" stroke-width="1.4"/>
    </symbol>
    <symbol id="cyl" viewBox="0 0 20 24">
      <path d="M1,4 v16 a9,3 0 0 0 18,0 v-16" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <ellipse cx="10" cy="4" rx="9" ry="3" fill="#fff" stroke="#222" stroke-width="1.4"/>
    </symbol>
  </defs>
  <rect width="1500" height="890" fill="#ffffff"/>

  <text x="750" y="36" class="h1" text-anchor="middle">CampusNest — UML Component Diagram</text>
  <text x="750" y="58" class="h2" text-anchor="middle">Smart Student Accommodation and Roommate Matching System · as implemented (v1)</text>

  <!-- System boundary -->
  <rect x="40" y="80" width="1200" height="665" class="sys"/>
  <text x="56" y="100" class="st">«system»</text>
  <text x="56" y="118" class="onm" fill="#1f3a5f">CampusNest</text>

  <!-- Web UI -->
  <rect x="470" y="96" width="330" height="70" class="ui"/>
  <use href="#ci" x="776" y="102" width="14" height="16"/>
  <text x="635" y="113" class="st" text-anchor="middle">«component»</text>
  <text x="635" y="133" class="onm" text-anchor="middle">Web UI</text>
  <text x="635" y="151" class="sb" text-anchor="middle">Next.js · Student, Owner and Admin portals</text>

  <!-- OpenStreetMap (external) -->
  <rect x="1275" y="96" width="195" height="70" class="ext"/>
  <text x="1372" y="113" class="st" text-anchor="middle">«external component»</text>
  <text x="1372" y="133" class="nm" text-anchor="middle">OpenStreetMap</text>
  <text x="1372" y="151" class="sb" text-anchor="middle">Tile Service</text>
  <path d="M800,131 H1273" class="dep"/>
  <text x="1037" y="123" class="lbl" text-anchor="middle">«use»  map tiles (HTTPS)</text>

  <!-- Web UI -> API -->
  <path d="M635,166 V209" class="dep"/>
  <text x="647" y="193" class="lbl">«use»  HTTP + JSON, /api/v1</text>

  <!-- API & Security layer -->
  <rect x="70" y="210" width="1140" height="64" class="api"/>
  <use href="#ci" x="1186" y="216" width="14" height="16"/>
  <text x="640" y="227" class="st" text-anchor="middle">«component»</text>
  <text x="640" y="246" class="onm" text-anchor="middle">REST API &amp; Security Layer</text>
  <text x="640" y="264" class="sb" text-anchor="middle">Spring REST controllers + Spring Security — login session, CSRF check, login rate limit, role rules (/student · /owner · /admin)</text>

  <!-- Business services subsystem -->
  <rect x="70" y="300" width="1140" height="292" class="sub"/>
  <text x="298" y="318" class="st" text-anchor="middle">«subsystem»</text>
  <text x="298" y="336" class="nm" text-anchor="middle">Business Services</text>

  <!-- API -> services -->
  <path d="M185,274 V361" class="dep"/>
  <path d="M412,274 V361" class="dep"/>
  <path d="M639,274 V361" class="dep"/>
  <path d="M866,274 V361" class="dep"/>
  <path d="M1093,274 V361" class="dep"/>
  <path d="M525,274 V489" class="dep"/>
  <path d="M752,274 V489" class="dep"/>

  <!-- Row C services -->
  <rect x="90" y="362" width="190" height="84" class="svc"/>
  <use href="#ci" x="258" y="368" width="13" height="15"/>
  <text x="185" y="378" class="st" text-anchor="middle">«component»</text>
  <text x="185" y="397" class="nm" text-anchor="middle">Account Service</text>
  <text x="185" y="415" class="sb" text-anchor="middle">login, profiles, preferences</text>
  <text x="185" y="438" class="pv" text-anchor="middle">provides IAccount</text>

  <rect x="317" y="362" width="190" height="84" class="svc"/>
  <use href="#ci" x="485" y="368" width="13" height="15"/>
  <text x="412" y="378" class="st" text-anchor="middle">«component»</text>
  <text x="412" y="397" class="nm" text-anchor="middle">Roommate Matching</text>
  <text x="412" y="415" class="sb" text-anchor="middle">compatibility %, requests</text>
  <text x="412" y="438" class="pv" text-anchor="middle">provides IRoommateMatching</text>

  <rect x="544" y="362" width="190" height="84" class="svc"/>
  <use href="#ci" x="712" y="368" width="13" height="15"/>
  <text x="639" y="378" class="st" text-anchor="middle">«component»</text>
  <text x="639" y="397" class="nm" text-anchor="middle">Recommendation Engine</text>
  <text x="639" y="415" class="sb" text-anchor="middle">suitability score, comparison</text>
  <text x="639" y="438" class="pv" text-anchor="middle">provides IRecommendation</text>

  <rect x="771" y="362" width="190" height="84" class="svc"/>
  <use href="#ci" x="939" y="368" width="13" height="15"/>
  <text x="866" y="378" class="st" text-anchor="middle">«component»</text>
  <text x="866" y="397" class="nm" text-anchor="middle">Moderation Service</text>
  <text x="866" y="415" class="sb" text-anchor="middle">listing review, owner checks</text>
  <text x="866" y="438" class="pv" text-anchor="middle">provides IModeration</text>

  <rect x="998" y="362" width="190" height="84" class="svc"/>
  <use href="#ci" x="1166" y="368" width="13" height="15"/>
  <text x="1093" y="378" class="st" text-anchor="middle">«component»</text>
  <text x="1093" y="397" class="nm" text-anchor="middle">Engagement Service</text>
  <text x="1093" y="415" class="sb" text-anchor="middle">enquiries, reviews, reports</text>
  <text x="1093" y="438" class="pv" text-anchor="middle">provides IEngagement</text>

  <!-- Row D services -->
  <rect x="380" y="490" width="220" height="84" class="svc"/>
  <use href="#ci" x="578" y="496" width="13" height="15"/>
  <text x="490" y="506" class="st" text-anchor="middle">«component»</text>
  <text x="490" y="525" class="nm" text-anchor="middle">Commute &amp; Cost Estimator</text>
  <text x="490" y="543" class="sb" text-anchor="middle">travel time, monthly fares</text>
  <text x="490" y="566" class="pv" text-anchor="middle">provides ICommute</text>

  <rect x="700" y="490" width="260" height="84" class="svc"/>
  <use href="#ci" x="938" y="496" width="13" height="15"/>
  <text x="830" y="506" class="st" text-anchor="middle">«component»</text>
  <text x="830" y="525" class="nm" text-anchor="middle">Listing Service</text>
  <text x="830" y="543" class="sb" text-anchor="middle">search, owner listings, lifecycle, photos</text>
  <text x="830" y="566" class="pv" text-anchor="middle">provides IListing</text>

  <!-- service -> service -->
  <path d="M570,446 V489" class="dep"/>
  <path d="M715,446 V489" class="dep"/>
  <path d="M866,446 V489" class="dep"/>
  <path d="M1010,446 L947,489" class="dep"/>

  <!-- Data layer -->
  <path d="M300,592 V639" class="dep"/>
  <text x="310" y="621" class="lbl">«use»  I…Store (all services)</text>
  <path d="M930,574 V639" class="dep"/>
  <text x="940" y="612" class="lbl">«use»  IImageStore</text>

  <rect x="90" y="640" width="690" height="74" class="data"/>
  <use href="#ci" x="758" y="646" width="13" height="15"/>
  <text x="435" y="656" class="st" text-anchor="middle">«component»</text>
  <text x="435" y="675" class="nm" text-anchor="middle">Data Access Layer (Repositories)</text>
  <text x="435" y="692" class="sb" text-anchor="middle">Spring Data JPA · provides IUserStore, IListingStore, IEngagementStore,</text>
  <text x="435" y="707" class="sb" text-anchor="middle">IRoommateStore, IReferenceStore (colleges, stations, fares)</text>

  <rect x="860" y="640" width="328" height="74" class="data"/>
  <use href="#ci" x="1166" y="646" width="13" height="15"/>
  <text x="1024" y="656" class="st" text-anchor="middle">«component»</text>
  <text x="1024" y="675" class="nm" text-anchor="middle">Image Store</text>
  <text x="1024" y="692" class="sb" text-anchor="middle">checks image type, removes EXIF, saves file</text>
  <text x="1024" y="707" class="pv" text-anchor="middle">provides IImageStore</text>

  <!-- External data -->
  <path d="M435,714 V789" class="dep"/>
  <text x="447" y="760" class="lbl">«use»  JDBC / SQL</text>
  <rect x="280" y="790" width="310" height="70" class="ext"/>
  <use href="#cyl" x="565" y="797" width="15" height="18"/>
  <text x="435" y="808" class="st" text-anchor="middle">«external» database engine</text>
  <text x="435" y="828" class="nm" text-anchor="middle">PostgreSQL 18</text>
  <text x="435" y="846" class="sb" text-anchor="middle">23 tables, schema created by Flyway</text>

  <path d="M1024,714 V789" class="dep"/>
  <text x="1036" y="760" class="lbl">«use»  file I/O</text>
  <rect x="870" y="790" width="310" height="70" class="ext"/>
  <text x="1025" y="808" class="st" text-anchor="middle">«external»</text>
  <text x="1025" y="828" class="nm" text-anchor="middle">Server file system</text>
  <text x="1025" y="846" class="sb" text-anchor="middle">uploads/ folder (listing photos)</text>

  <!-- Reading note -->
  <path d="M1270,232 H1461 L1475,246 V428 H1270 Z" class="note"/>
  <path d="M1461,232 V246 H1475" fill="none" stroke="#888" stroke-width="1"/>
  <text x="1282" y="254" class="lbl" font-weight="bold">How to read it</text>
  <text x="1282" y="276" class="sb">Dashed arrow «use» points from</text>
  <text x="1282" y="292" class="sb">the component that needs a</text>
  <text x="1282" y="308" class="sb">service to the one providing it.</text>
  <text x="1282" y="332" class="sb">Each service offers one</text>
  <text x="1282" y="348" class="sb">interface (IAccount, IListing …).</text>
  <text x="1282" y="372" class="sb">The Web UI never reads the</text>
  <text x="1282" y="388" class="sb">database: every request passes</text>
  <text x="1282" y="404" class="sb">the security layer first.</text>

  <!-- Legend -->
  <rect x="1270" y="455" width="205" height="128" fill="#fff" stroke="#aaa" stroke-width="1"/>
  <text x="1282" y="474" class="lbl" font-weight="bold">Legend</text>
  <path d="M1282,494 H1322" class="dep"/>
  <text x="1332" y="498" class="sb">«use» dependency</text>
  <use href="#ci" x="1294" y="508" width="14" height="16"/>
  <text x="1332" y="521" class="sb">software component</text>
  <rect x="1284" y="532" width="34" height="18" class="ext"/>
  <text x="1332" y="545" class="sb">outside the system</text>
  <text x="1282" y="570" class="pv">provides I…</text>
  <text x="1352" y="570" class="sb">offered interface</text>

</svg>
