<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="900" viewBox="0 0 1270 900">
  <title>CampusNest UML deployment diagram</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .h1 { font-size: 22px; font-weight: bold; }
    .h2 { font-size: 13px; fill: #555; }
    .st { font-size: 11px; fill: #555; }
    .nm { font-size: 14px; font-weight: bold; }
    .onm { font-size: 15px; font-weight: bold; }
    .sb { font-size: 11.5px; fill: #444; }
    .lbl { font-size: 12px; }
    .sm { font-size: 11px; }
    .front { fill: #ffffff; stroke: #111; stroke-width: 1.8; }
    .face { fill: #e8edf4; stroke: #111; stroke-width: 1.8; stroke-linejoin: round; }
    .ee { fill: #f6f8fb; stroke: #333; stroke-width: 1.4; }
    .eeface { fill: #e3e9f1; stroke: #333; stroke-width: 1.4; stroke-linejoin: round; }
    .art { fill: #fffdf6; stroke: #333; stroke-width: 1.3; }
    .ext { fill: #fbf7ee; stroke: #111; stroke-width: 1.8; }
    .path { fill: none; stroke: #111; stroke-width: 1.6; }
    .dep { fill: none; stroke: #222; stroke-width: 1.3; stroke-dasharray: 6 4; marker-end: url(#open); }
    .bg { fill: #ffffff; }
  </style>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
    <symbol id="doc" viewBox="0 0 16 20">
      <path d="M1,1 H10 L15,6 V19 H1 Z" fill="#fff" stroke="#222" stroke-width="1.3"/>
      <path d="M10,1 V6 H15" fill="none" stroke="#222" stroke-width="1.3"/>
    </symbol>
    <symbol id="cyl" viewBox="0 0 20 24">
      <path d="M1,4 v16 a9,3 0 0 0 18,0 v-16" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <ellipse cx="10" cy="4" rx="9" ry="3" fill="#fff" stroke="#222" stroke-width="1.4"/>
    </symbol>
  </defs>
  <rect width="1270" height="900" fill="#ffffff"/>

  <text x="638" y="36" class="h1" text-anchor="middle">CampusNest — UML Deployment Diagram</text>
  <text x="638" y="58" class="h2" text-anchor="middle">Demonstration setup used for the faculty review (v1)</text>


  <!-- ================= User device ================= -->
  <polygon points="40,140 56,124 386,124 370,140" class="face"/>
  <polygon points="370,140 386,124 386,554 370,570" class="face"/>
  <rect x="40" y="140" width="330" height="430" class="front"/>
  <text x="56" y="164" class="st">«device»</text>
  <text x="56" y="184" class="onm">User device</text>
  <text x="56" y="202" class="sb">laptop or phone (Student, Owner, Admin)</text>

  <polygon points="65,225 75,215 355,215 345,225" class="eeface"/>
  <polygon points="345,225 355,215 355,530 345,540" class="eeface"/>
  <rect x="65" y="225" width="280" height="315" class="ee"/>
  <text x="80" y="245" class="st">«execution environment»</text>
  <text x="80" y="263" class="nm">Web browser</text>
  <text x="80" y="280" class="sb">Chrome / Edge / Firefox</text>

  <rect x="85" y="296" width="240" height="84" class="art"/>
  <use href="#doc" x="301" y="302" width="14" height="18"/>
  <text x="205" y="314" class="st" text-anchor="middle">«artifact»</text>
  <text x="205" y="334" class="nm" text-anchor="middle">CampusNest web UI</text>
  <text x="205" y="352" class="sb" text-anchor="middle">HTML, JavaScript, CSS from Next.js</text>
  <text x="205" y="369" class="sb" text-anchor="middle">includes the Leaflet map</text>

  <text x="85" y="412" class="lbl" font-weight="bold">Kept in the browser:</text>
  <text x="85" y="432" class="sb">• session cookie JSESSIONID (HttpOnly,</text>
  <text x="97" y="448" class="sb">SameSite=Lax) — only a random id</text>
  <text x="85" y="468" class="sb">• XSRF-TOKEN cookie (CSRF protection)</text>
  <text x="85" y="488" class="sb">• no passwords or personal data stored</text>

  <!-- ================= OpenStreetMap ================= -->
  <polygon points="40,690 56,674 386,674 370,690" class="face"/>
  <polygon points="370,690 386,674 386,774 370,790" class="face"/>
  <rect x="40" y="690" width="330" height="100" class="ext"/>
  <text x="56" y="714" class="st">«external server»</text>
  <text x="56" y="734" class="onm">OpenStreetMap tile server</text>
  <text x="56" y="754" class="sb">tile.openstreetmap.org · map images only</text>

  <!-- ================= Application server ================= -->
  <polygon points="500,110 516,94 1236,94 1220,110" class="face"/>
  <polygon points="1220,110 1236,94 1236,794 1220,810" class="face"/>
  <rect x="500" y="110" width="720" height="700" class="front"/>
  <text x="516" y="134" class="st">«device»</text>
  <text x="516" y="154" class="onm">Application server</text>
  <text x="516" y="172" class="sb">demo: team laptop (Windows 11) · production: one Linux VM</text>

  <!-- Node.js -->
  <polygon points="530,205 540,195 860,195 850,205" class="eeface"/>
  <polygon points="850,205 860,195 860,365 850,375" class="eeface"/>
  <rect x="530" y="205" width="320" height="170" class="ee"/>
  <text x="545" y="225" class="st">«execution environment»</text>
  <text x="545" y="243" class="nm">Node.js 24</text>
  <rect x="550" y="258" width="280" height="98" class="art"/>
  <use href="#doc" x="806" y="264" width="14" height="18"/>
  <text x="690" y="276" class="st" text-anchor="middle">«artifact»</text>
  <text x="690" y="296" class="nm" text-anchor="middle">frontend — Next.js 16 app</text>
  <text x="690" y="314" class="sb" text-anchor="middle">next dev / next start · port 3000</text>
  <text x="690" y="331" class="sb" text-anchor="middle">rewrites /api/* to port 8080</text>
  <text x="690" y="348" class="sb" text-anchor="middle">(folder frontend/)</text>

  <!-- JVM -->
  <polygon points="530,445 540,435 860,435 850,445" class="eeface"/>
  <polygon points="850,445 860,435 860,615 850,625" class="eeface"/>
  <rect x="530" y="445" width="320" height="180" class="ee"/>
  <text x="545" y="465" class="st">«execution environment»</text>
  <text x="545" y="483" class="nm">JVM — OpenJDK 25</text>
  <rect x="550" y="498" width="280" height="110" class="art"/>
  <use href="#doc" x="806" y="504" width="14" height="18"/>
  <text x="690" y="516" class="st" text-anchor="middle">«artifact»</text>
  <text x="690" y="536" class="nm" text-anchor="middle">campusnest-backend.jar</text>
  <text x="690" y="554" class="sb" text-anchor="middle">0.0.1-SNAPSHOT, built with Maven</text>
  <text x="690" y="572" class="sb" text-anchor="middle">Spring Boot 4.1 · embedded Tomcat</text>
  <text x="690" y="590" class="sb" text-anchor="middle">port 8080 (REST API /api/v1)</text>

  <!-- .env -->
  <path d="M690,625 V679" class="dep"/>
  <text x="702" y="657" class="sm">«read»</text>
  <rect x="530" y="680" width="320" height="96" class="art"/>
  <use href="#doc" x="826" y="686" width="14" height="18"/>
  <text x="690" y="698" class="st" text-anchor="middle">«artifact»</text>
  <text x="690" y="718" class="nm" text-anchor="middle">.env (configuration)</text>
  <text x="690" y="736" class="sb" text-anchor="middle">database credentials, first admin account,</text>
  <text x="690" y="752" class="sb" text-anchor="middle">feature flags — git-ignored, never committed</text>

  <!-- Docker -->
  <polygon points="900,205 910,195 1200,195 1190,205" class="eeface"/>
  <polygon points="1190,205 1200,195 1200,575 1190,585" class="eeface"/>
  <rect x="900" y="205" width="290" height="380" class="ee"/>
  <text x="915" y="225" class="st">«execution environment»</text>
  <text x="915" y="243" class="nm">Docker Engine</text>

  <polygon points="920,265 928,257 1178,257 1170,265" class="face"/>
  <polygon points="1170,265 1178,257 1178,557 1170,565" class="face"/>
  <rect x="920" y="265" width="250" height="300" class="front"/>
  <text x="935" y="285" class="st">«container»</text>
  <text x="935" y="303" class="nm">campusnest-db</text>
  <text x="935" y="320" class="sb">image postgres:18-alpine</text>

  <rect x="940" y="335" width="210" height="105" class="art"/>
  <use href="#cyl" x="1128" y="341" width="15" height="18"/>
  <text x="1045" y="353" class="st" text-anchor="middle">«database»</text>
  <text x="1045" y="373" class="nm" text-anchor="middle">campusnest</text>
  <text x="1045" y="391" class="sb" text-anchor="middle">PostgreSQL 18 · 23 tables</text>
  <text x="1045" y="408" class="sb" text-anchor="middle">schema by Flyway V1–V7</text>
  <text x="1045" y="425" class="sb" text-anchor="middle">port 5432, bound to 127.0.0.1</text>

  <rect x="940" y="458" width="210" height="88" class="art"/>
  <use href="#doc" x="1126" y="464" width="14" height="18"/>
  <text x="1045" y="476" class="st" text-anchor="middle">«volume»</text>
  <text x="1045" y="496" class="nm" text-anchor="middle">campusnest-db-data</text>
  <text x="1045" y="514" class="sb" text-anchor="middle">database files on disk,</text>
  <text x="1045" y="530" class="sb" text-anchor="middle">kept across restarts</text>

  <!-- Photo storage -->
  <path d="M900,640 h80 l10,10 h200 v110 h-290 z" class="ee"/>
  <text x="1045" y="672" class="st" text-anchor="middle">«file system»</text>
  <text x="1045" y="692" class="nm" text-anchor="middle">uploads/  (STORAGE_DIR)</text>
  <text x="1045" y="710" class="sb" text-anchor="middle">listing photos</text>
  <text x="1045" y="727" class="sb" text-anchor="middle">re-encoded, EXIF / GPS removed</text>

  <!-- ===== communication paths ===== -->
  <line x1="345" y1="300" x2="530" y2="285" class="path"/>
  <line x1="200" y1="540" x2="200" y2="674" class="path"/>
  <line x1="690" y1="375" x2="690" y2="435" class="path"/>
  <line x1="850" y1="520" x2="920" y2="420" class="path"/>
  <line x1="850" y1="590" x2="900" y2="690" class="path"/>

  <!-- ===== path labels ===== -->
  <text x="443" y="262" class="lbl" text-anchor="middle">«HTTP»</text>
  <text x="443" y="278" class="lbl" text-anchor="middle">:3000</text>
  <text x="443" y="318" class="sb" text-anchor="middle">pages,</text>
  <text x="443" y="333" class="sb" text-anchor="middle">/api/* calls</text>

  <text x="213" y="612" class="lbl">«HTTPS»</text>
  <text x="213" y="629" class="sb">map tiles (PNG)</text>

  <text x="702" y="401" class="lbl">«HTTP» localhost:8080</text>
  <text x="702" y="418" class="sb">/api/* forwarded</text>

  <rect x="856" y="455" width="58" height="32" class="bg"/>
  <text x="885" y="468" class="sm" text-anchor="middle">«JDBC»</text>
  <text x="885" y="482" class="sm" text-anchor="middle">TCP 5432</text>

  <rect x="851" y="632" width="48" height="18" class="bg"/>
  <text x="875" y="645" class="sm" text-anchor="middle">file I/O</text>

  <!-- ===== note ===== -->
  <path d="M40,826 H1224 L1236,838 V884 H40 Z" fill="#fffef2" stroke="#666" stroke-width="1.2"/>
  <path d="M1224,826 V838 H1236" fill="none" stroke="#666" stroke-width="1.2"/>
  <text x="54" y="850" class="lbl">Demo: all server processes run on one laptop; the browser opens http://localhost:3000 and the database port is reachable only from that laptop.</text>
  <text x="54" y="870" class="lbl">Public deployment: put an HTTPS reverse proxy (Caddy / Nginx) in front of port 3000, set SESSION_COOKIE_SECURE=true and DEMO_DATA=false (see docs/DEPLOYMENT.md).</text>
</svg>
