<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="860" viewBox="0 0 1230 860">
  <title>CampusNest UML deployment diagram</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .h1 { font-size: 22px; font-weight: bold; }
    .h2 { font-size: 13px; fill: #555; }
    .hd { font-size: 13px; font-weight: bold; fill: #1f3a5f; letter-spacing: 0.5px; }
    .st { font-size: 11px; fill: #555; }
    .nm { font-size: 14px; font-weight: bold; }
    .onm { font-size: 15px; font-weight: bold; }
    .sb { font-size: 11.5px; fill: #444; }
    .lbl { font-size: 12px; }
    .sm { font-size: 11px; }
    .front { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.8; }
    .face { fill: #e4ebf4; stroke: #1f3a5f; stroke-width: 1.8; stroke-linejoin: round; }
    .dev { fill: #eef3fb; stroke: #34495e; stroke-width: 1.4; }
    .devface { fill: #dbe4f0; stroke: #34495e; stroke-width: 1.4; stroke-linejoin: round; }
    .ee { fill: #f2f8f6; stroke: #34495e; stroke-width: 1.3; }
    .eeface { fill: #dcebe6; stroke: #34495e; stroke-width: 1.3; stroke-linejoin: round; }
    .art { fill: #fffdf6; stroke: #555; stroke-width: 1.2; }
    .ext { fill: #fdf5ea; stroke: #b0742a; stroke-width: 1.8; }
    .extface { fill: #f6e6cf; stroke: #b0742a; stroke-width: 1.8; stroke-linejoin: round; }
    .path { fill: none; stroke: #111; stroke-width: 1.8; }
    .dep { fill: none; stroke: #222; stroke-width: 1.3; stroke-dasharray: 6 4; marker-end: url(#open); }
  </style>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
    <symbol id="doc" viewBox="0 0 16 20">
      <path d="M1,1 H10 L15,6 V19 H1 Z" fill="#fff" stroke="#222" stroke-width="1.3"/>
      <path d="M10,1 V6 H15" fill="none" stroke="#222" stroke-width="1.3"/>
    </symbol>
    <symbol id="cyl" viewBox="0 0 20 24">
      <path d="M1,4 v16 a9,3 0 0 0 18,0 v-16" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <ellipse cx="10" cy="4" rx="9" ry="3" fill="#fff" stroke="#222" stroke-width="1.4"/>
    </symbol>
  </defs>
  <rect width="1230" height="860" fill="#ffffff"/>

  <text x="615" y="34" class="h1" text-anchor="middle">CampusNest — UML Deployment Diagram</text>
  <text x="615" y="56" class="h2" text-anchor="middle">Real deployment used for development and the faculty demonstration (v1)</text>

  <text x="30" y="90" class="hd">CLIENT DEVICES</text>
  <text x="440" y="90" class="hd">APPLICATION HOSTING (one machine in the demo)</text>

  <!-- ================= Client devices ================= -->
  <polygon points="30,120 44,106 364,106 350,120" class="face"/>
  <polygon points="350,120 364,106 364,681 350,695" class="face"/>
  <rect x="30" y="120" width="320" height="575" class="front"/>
  <text x="46" y="142" class="st">«device»</text>
  <text x="46" y="160" class="onm">Client devices</text>
  <text x="46" y="176" class="sb">any device with a modern web browser</text>

  <!-- Student -->
  <polygon points="50,195 60,185 330,185 320,195" class="devface"/>
  <polygon points="320,195 330,185 330,330 320,340" class="devface"/>
  <rect x="50" y="195" width="270" height="145" class="dev"/>
  <text x="64" y="215" class="st">«device»</text>
  <text x="64" y="233" class="nm">Student laptop / phone</text>
  <rect x="66" y="245" width="238" height="82" class="ee"/>
  <text x="78" y="262" class="st">«executionEnvironment»</text>
  <text x="78" y="280" class="nm">Web browser</text>
  <text x="78" y="298" class="sb">Student portal: search, scores,</text>
  <text x="78" y="314" class="sb">compare, roommates</text>

  <!-- Owner -->
  <polygon points="50,360 60,350 330,350 320,360" class="devface"/>
  <polygon points="320,360 330,350 330,495 320,505" class="devface"/>
  <rect x="50" y="360" width="270" height="145" class="dev"/>
  <text x="64" y="380" class="st">«device»</text>
  <text x="64" y="398" class="nm">Owner phone / PC</text>
  <rect x="66" y="410" width="238" height="82" class="ee"/>
  <text x="78" y="427" class="st">«executionEnvironment»</text>
  <text x="78" y="445" class="nm">Web browser</text>
  <text x="78" y="463" class="sb">Owner portal: listings, photos,</text>
  <text x="78" y="479" class="sb">enquiries, verification</text>

  <!-- Admin -->
  <polygon points="50,525 60,515 330,515 320,525" class="devface"/>
  <polygon points="320,525 330,515 330,660 320,670" class="devface"/>
  <rect x="50" y="525" width="270" height="145" class="dev"/>
  <text x="64" y="545" class="st">«device»</text>
  <text x="64" y="563" class="nm">Administrator PC</text>
  <rect x="66" y="575" width="238" height="82" class="ee"/>
  <text x="78" y="592" class="st">«executionEnvironment»</text>
  <text x="78" y="610" class="nm">Web browser</text>
  <text x="78" y="628" class="sb">Admin portal: listing review,</text>
  <text x="78" y="644" class="sb">reports, owners, users</text>

  <!-- ================= OpenStreetMap ================= -->
  <polygon points="30,750 44,736 364,736 350,750" class="extface"/>
  <polygon points="350,750 364,736 364,816 350,830" class="extface"/>
  <rect x="30" y="750" width="320" height="80" class="ext"/>
  <text x="46" y="770" class="st">«external system»</text>
  <text x="46" y="790" class="nm">OpenStreetMap Tile Server</text>
  <text x="46" y="808" class="sb">tile.openstreetmap.org · map images only</text>

  <!-- ================= Application server ================= -->
  <polygon points="430,120 446,104 1206,104 1190,120" class="face"/>
  <polygon points="1190,120 1206,104 1206,814 1190,830" class="face"/>
  <rect x="430" y="120" width="760" height="710" class="front"/>
  <text x="446" y="142" class="st">«device»</text>
  <text x="446" y="162" class="onm">Application Server</text>
  <text x="446" y="180" class="sb">demo: team laptop (Windows 11) · production: one Linux VM</text>

  <!-- Node.js -->
  <polygon points="460,210 470,200 800,200 790,210" class="eeface"/>
  <polygon points="790,210 800,200 800,365 790,375" class="eeface"/>
  <rect x="460" y="210" width="330" height="165" class="ee"/>
  <text x="475" y="230" class="st">«executionEnvironment»</text>
  <text x="475" y="248" class="nm">Node.js 24</text>
  <rect x="478" y="262" width="294" height="98" class="art"/>
  <use href="#doc" x="748" y="268" width="14" height="18"/>
  <text x="625" y="280" class="st" text-anchor="middle">«artifact»</text>
  <text x="625" y="300" class="nm" text-anchor="middle">frontend build (Next.js 16)</text>
  <text x="625" y="318" class="sb" text-anchor="middle">next start · port 3000</text>
  <text x="625" y="335" class="sb" text-anchor="middle">serves pages, forwards /api/* to :8080</text>
  <text x="625" y="351" class="sb" text-anchor="middle">(frontend/.next)</text>

  <!-- JVM -->
  <polygon points="460,455 470,445 800,445 790,455" class="eeface"/>
  <polygon points="790,455 800,445 800,630 790,640" class="eeface"/>
  <rect x="460" y="455" width="330" height="185" class="ee"/>
  <text x="475" y="475" class="st">«executionEnvironment»</text>
  <text x="475" y="493" class="nm">JVM — OpenJDK 25</text>
  <rect x="478" y="507" width="294" height="118" class="art"/>
  <use href="#doc" x="748" y="513" width="14" height="18"/>
  <text x="625" y="525" class="st" text-anchor="middle">«artifact»</text>
  <text x="625" y="545" class="nm" text-anchor="middle">campusnest-backend.jar</text>
  <text x="625" y="563" class="sb" text-anchor="middle">version 0.0.1-SNAPSHOT (Maven build)</text>
  <text x="625" y="580" class="sb" text-anchor="middle">Spring Boot 4.1 · embedded Tomcat</text>
  <text x="625" y="597" class="sb" text-anchor="middle">REST API /api/v1 · port 8080</text>
  <text x="625" y="614" class="sb" text-anchor="middle">business rules, login and role checks</text>

  <!-- .env -->
  <rect x="460" y="690" width="330" height="100" class="art"/>
  <use href="#doc" x="766" y="696" width="14" height="18"/>
  <text x="625" y="708" class="st" text-anchor="middle">«artifact»</text>
  <text x="625" y="728" class="nm" text-anchor="middle">.env (configuration file)</text>
  <text x="625" y="746" class="sb" text-anchor="middle">database credentials, first admin account,</text>
  <text x="625" y="762" class="sb" text-anchor="middle">feature flags · git-ignored, never committed</text>

  <!-- Docker / PostgreSQL -->
  <polygon points="850,210 860,200 1170,200 1160,210" class="eeface"/>
  <polygon points="1160,210 1170,200 1170,600 1160,610" class="eeface"/>
  <rect x="850" y="210" width="310" height="400" class="ee"/>
  <text x="865" y="230" class="st">«executionEnvironment»</text>
  <text x="865" y="248" class="nm">Docker Engine</text>

  <polygon points="870,270 878,262 1148,262 1140,270" class="eeface"/>
  <polygon points="1140,270 1148,262 1148,582 1140,590" class="eeface"/>
  <rect x="870" y="270" width="270" height="320" class="ee" fill="#ffffff"/>
  <text x="884" y="290" class="st">«executionEnvironment»</text>
  <text x="884" y="308" class="nm">PostgreSQL 18 DBMS</text>
  <text x="884" y="324" class="sb">container image postgres:18-alpine</text>

  <rect x="888" y="340" width="234" height="110" class="art"/>
  <use href="#cyl" x="1100" y="346" width="14" height="17"/>
  <text x="1005" y="358" class="st" text-anchor="middle">«artifact»</text>
  <text x="1005" y="378" class="nm" text-anchor="middle">campusnest database</text>
  <text x="1005" y="396" class="sb" text-anchor="middle">23 tables, created by</text>
  <text x="1005" y="412" class="sb" text-anchor="middle">Flyway scripts V1–V7 (.sql)</text>
  <text x="1005" y="430" class="sb" text-anchor="middle">port 5432 · bound to 127.0.0.1</text>

  <rect x="888" y="468" width="234" height="104" class="art"/>
  <use href="#doc" x="1100" y="474" width="14" height="18"/>
  <text x="1005" y="486" class="st" text-anchor="middle">«artifact»</text>
  <text x="1005" y="506" class="nm" text-anchor="middle">campusnest-db-data</text>
  <text x="1005" y="524" class="sb" text-anchor="middle">Docker volume: database</text>
  <text x="1005" y="540" class="sb" text-anchor="middle">files kept across restarts</text>

  <!-- File system -->
  <path d="M850,650 h80 l10,10 h220 v130 h-310 z" class="ee"/>
  <text x="1005" y="684" class="st" text-anchor="middle">«file system»</text>
  <text x="1005" y="704" class="nm" text-anchor="middle">uploads/ (STORAGE_DIR)</text>
  <text x="1005" y="724" class="st" text-anchor="middle">«artifact» listing photos (JPEG / PNG)</text>
  <text x="1005" y="742" class="sb" text-anchor="middle">re-encoded, EXIF / GPS data removed</text>

  <!-- ================= communication paths ================= -->
  <line x1="350" y1="300" x2="460" y2="300" class="path"/>
  <text x="397" y="277" class="sm" text-anchor="middle" font-weight="bold">«HTTP»</text>
  <text x="397" y="291" class="sm" text-anchor="middle">:3000</text>
  <text x="397" y="316" class="sm" text-anchor="middle">(HTTPS in</text>
  <text x="397" y="329" class="sm" text-anchor="middle">production)</text>

  <line x1="190" y1="695" x2="190" y2="736" class="path"/>
  <text x="202" y="720" class="lbl">«HTTPS» map tiles</text>

  <line x1="625" y1="375" x2="625" y2="445" class="path"/>
  <text x="637" y="405" class="lbl">«HTTP» localhost:8080</text>
  <text x="637" y="421" class="sb">/api/* forwarded</text>

  <line x1="790" y1="520" x2="870" y2="520" class="path"/>
  <text x="822" y="498" class="sm" text-anchor="middle">«JDBC»</text>
  <text x="822" y="512" class="sm" text-anchor="middle">:5432</text>

  <line x1="790" y1="610" x2="850" y2="700" class="path"/>
  <rect x="799" y="640" width="46" height="16" fill="#ffffff"/>
  <text x="822" y="652" class="sm" text-anchor="middle">file I/O</text>

  <path d="M625,640 V689" class="dep"/>
  <text x="637" y="669" class="sm">«read»</text>
</svg>
