spring.application.name=campusnest

# Load local settings from the repo-root .env file (git-ignored).
# "optional:" means the app still starts if the file is missing (e.g. in CI);
# real environment variables always take precedence over values in .env.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Database ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:campusnest}
spring.datasource.username=${POSTGRES_USER:campusnest}
spring.datasource.password=${POSTGRES_PASSWORD:}
# Fail fast (3 s instead of the 30 s default) when the database is unreachable,
# so requests return a clear error instead of hanging.
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema (SQL files in src/main/resources/db/migration).
# Hibernate only checks that entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside service methods, not during JSON rendering.
spring.jpa.open-in-view=false

# --- Web ---
server.port=${BACKEND_PORT:8080}
# Never send stack traces or internal exception messages to clients.
server.error.include-stacktrace=never
server.error.include-message=never

# --- CampusNest ---
# Comma-separated list of browser origins allowed to call the API directly.
campusnest.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
