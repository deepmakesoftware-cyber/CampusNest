spring.application.name=campusnest

# Load local settings from the repo-root .env file (git-ignored).
# "optional:" means the app still starts if the file is missing (e.g. in CI);
# real environment variables always take precedence over values in .env.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Database ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:campusnest}
spring.datasource.username=${POSTGRES_USER:campusnest}
spring.datasource.password=${POSTGRES_PASSWORD:}
# Fail fast (3 s instead of the 30 s default) when the database is unreachable,
# so requests return a clear error instead of hanging.
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema (SQL files in src/main/resources/db/migration).
# Hibernate only checks that entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside service methods, not during JSON rendering.
spring.jpa.open-in-view=false
# Load lazy collections (rooms, photos...) for up to 50 listings in one query instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Web ---
server.port=${BACKEND_PORT:8080}
# Never send stack traces or internal exception messages to clients.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Sessions (login state lives on the server; the browser only holds a random session id) ---
server.servlet.session.timeout=2h
# HttpOnly: JavaScript cannot read the session cookie, so an XSS bug cannot steal it.
server.servlet.session.cookie.http-only=true
# Lax: the cookie is not sent on cross-site POSTs (extra CSRF defence).
server.servlet.session.cookie.same-site=lax
# Must be true in production (HTTPS only). False locally because localhost uses plain HTTP.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- Uploads (listing photos) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Let Tomcat read (and reject cleanly) bodies a bit over the limit instead of dropping the connection.
server.tomcat.max-swallow-size=10MB

# --- CampusNest ---
# Folder for uploaded photos (relative to where the backend is started). Git-ignored.
campusnest.storage.dir=${STORAGE_DIR:uploads}
# Comma-separated list of browser origins allowed to call the API directly.
campusnest.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
# First administrator account, created at startup if it does not exist (see AdminAccountInitializer).
campusnest.admin.email=${ADMIN_EMAIL:}
campusnest.admin.password=${ADMIN_PASSWORD:}
campusnest.admin.display-name=${ADMIN_DISPLAY_NAME:CampusNest Admin}
# Sample data for demonstrations (see DemoDataSeeder). Off unless DEMO_DATA=true.
campusnest.demo-data.enabled=${DEMO_DATA:false}
campusnest.demo-data.password=${DEMO_PASSWORD:}
